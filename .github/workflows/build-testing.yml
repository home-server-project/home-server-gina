---
name: Build signed Home Server Gina testing images

on:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  TESTING_TAG: "testing"

concurrency:
  group: ${{ github.workflow }}-testing
  cancel-in-progress: true

jobs:
  build_push:
    name: "Build testing ${{ matrix.display_name }}"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: Home Server Gina
            image_name: home-server-gina
            ucore_image: ghcr.io/ublue-os/ucore:lts

          - display_name: Home Server Gina HCI
            image_name: home-server-gina-hci
            ucore_image: ghcr.io/ublue-os/ucore-hci:lts

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout testing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing

      - name: Record testing source revision
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y%m%d)"

          echo "SOURCE_SHA=${source_sha}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${short_sha}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=${build_date}" >> "${GITHUB_ENV}"
          echo "IMMUTABLE_TAG=${TESTING_TAG}-${build_date}-${short_sha}" >> "${GITHUB_ENV}"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          registry="${IMAGE_REGISTRY,,}"
          image_name="${{ matrix.image_name }}"

          echo "IMAGE_REGISTRY=${registry}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${image_name}" >> "${GITHUB_ENV}"
          echo "UCORE_IMAGE=${{ matrix.ucore_image }}" >> "${GITHUB_ENV}"
          echo "IMAGE_REPOSITORY=${registry}/${image_name}" >> "${GITHUB_ENV}"

          echo "Testing source: ${SOURCE_SHA}"
          echo "Upstream: ${{ matrix.ucore_image }}"
          echo "Output: ${registry}/${image_name}:${TESTING_TAG}"
          echo "Immutable: ${registry}/${image_name}:${IMMUTABLE_TAG}"

      - name: Build Image
        shell: bash
        run: |
          just build \
            "${IMAGE_NAME}" \
            "${TESTING_TAG}"

      - name: Rechunk with rpm-ostree
        shell: bash
        run: |
          just ostree-rechunk \
            "${IMAGE_NAME}" \
            "${TESTING_TAG}"

      - name: Tag immutable testing image
        shell: bash
        run: |
          podman tag \
            "${IMAGE_NAME}:${TESTING_TAG}" \
            "${IMAGE_NAME}:${IMMUTABLE_TAG}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push testing image tags
        id: push-image
        shell: bash
        run: |
          set -euo pipefail

          podman push \
            --digestfile=/tmp/digestfile \
            "${IMAGE_NAME}:${IMMUTABLE_TAG}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMMUTABLE_TAG}"

          podman push \
            "${IMAGE_NAME}:${TESTING_TAG}" \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${TESTING_TAG}"

          digest="$(cat /tmp/digestfile)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Sign testing image digest
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          {
            echo "## Testing ${{ matrix.display_name }}"
            echo
            echo "- Source branch: testing"
            echo "- Source revision: ${SOURCE_SHA:-unknown}"
            echo "- Upstream: ${{ matrix.ucore_image }}"
            echo "- Moving tag: ${IMAGE_REGISTRY}/${IMAGE_NAME}:${TESTING_TAG}"
            echo "- Immutable tag: ${IMAGE_REGISTRY}/${IMAGE_NAME}:${IMMUTABLE_TAG:-unknown}"
            echo "- Digest: ${DIGEST:-not-published}"
          } >> "${GITHUB_STEP_SUMMARY}"
