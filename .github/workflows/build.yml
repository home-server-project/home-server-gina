---
name: Build signed Home Server Gina images

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'THIRD_PARTY_NOTICES.md'
  schedule:
    - cron: '45 3 * * 6'  # Saturday at 3:45am UTC
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_push:
    name: "Build and push ${{ matrix.display_name }}"
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: Home Server Gina
            image_name: home-server-gina
            ucore_image: ghcr.io/ublue-os/ucore:lts

          - display_name: Home Server Gina HCI
            image_name: home-server-gina-hci
            ucore_image: ghcr.io/ublue-os/ucore-hci:lts

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        shell: bash
        run: |
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> "${GITHUB_ENV}"

      - name: Default Tag
        id: gen-default-tag
        shell: bash
        run: |
          DEFAULT_TAG=$(just generate-default-tag)
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "${GITHUB_ENV}"

      - name: Prepare environment
        shell: bash
        run: |
          registry="${IMAGE_REGISTRY,,}"
          image_name="${IMAGE_NAME,,}"

          echo "IMAGE_REGISTRY=${registry}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${image_name}" >> "${GITHUB_ENV}"
          echo "UCORE_IMAGE=${{ matrix.ucore_image }}" >> "${GITHUB_ENV}"
          echo "IMAGE_REPOSITORY=${registry}/${image_name}" >> "${GITHUB_ENV}"

          echo "Building ${{ matrix.display_name }}:"
          echo "  Upstream: ${{ matrix.ucore_image }}"
          echo "  Output:   ${registry}/${image_name}:${DEFAULT_TAG}"

      - name: Build Image
        id: build-image
        run: |
          just build \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      - name: Rechunk with rpm-ostree
        id: rechunk
        run: |
          just ostree-rechunk \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}"

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        "${IMAGE_NAME}" \
                        "${DEFAULT_TAG}")"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> "${GITHUB_OUTPUT}"

      - name: Tag Image
        id: tag-images
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          just tag-images \
            "${IMAGE_NAME}" \
            "${DEFAULT_TAG}" \
            "${ALIAS_TAGS}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail

          for tag in ${ALIAS_TAGS}; do
            podman push \
              --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" \
              "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # Use old bundle format for rpm-ostree/container-libs compatibility.
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  release:
    name: Publish Home Server Gina release
    needs: build_push
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install release tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo

      - name: Login to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          max_attempts=5

          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            if printf '%s' "${GHCR_TOKEN}" | skopeo login ghcr.io \
              --username "${GITHUB_ACTOR}" \
              --password-stdin; then
              break
            fi

            if ((attempt == max_attempts)); then
              echo "GHCR login failed after ${max_attempts} attempts."
              exit 1
            fi

            delay=$((15 * 2 ** (attempt - 1)))
            echo "GHCR login attempt ${attempt} failed; retrying in ${delay} seconds."
            sleep "${delay}"
          done

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          source image-template.env

          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="$(git rev-parse --short HEAD)"

          # The Justfile publishes immutable tags in this format:
          # lts-YYYYMMDD-<git-sha>
          release_pattern="^${DEFAULT_TAG}-[0-9]{8}-${short_sha}$"

          list_tags_with_retry() {
            local repository="$1"
            local max_attempts=5
            local attempt
            local delay

            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if skopeo list-tags "docker://${registry}/${repository}"; then
                return 0
              fi

              if ((attempt == max_attempts)); then
                echo "Could not list tags for ${repository} after ${max_attempts} attempts." >&2
                return 1
              fi

              delay=$((15 * 2 ** (attempt - 1)))
              echo "Tag lookup for ${repository} failed; retrying in ${delay} seconds." >&2
              sleep "${delay}"
            done
          }

          find_release_tag() {
            local repository="$1"

            list_tags_with_retry "${repository}" \
              | jq -r --arg pattern "${release_pattern}" \
                  '.Tags[]? | select(test($pattern))' \
              | sort \
              | tail -n 1
          }

          gina_tag="$(find_release_tag "home-server-gina")"
          gina_hci_tag="$(find_release_tag "home-server-gina-hci")"

          if [[ -z "${gina_tag}" ]]; then
            echo "Could not find release tag for Home Server Gina."
            exit 1
          fi

          if [[ -z "${gina_hci_tag}" ]]; then
            echo "Could not find release tag for Home Server Gina HCI."
            exit 1
          fi

          if [[ "${gina_tag}" != "${gina_hci_tag}" ]]; then
            echo "Gina image release tags do not match:"
            echo "  Gina:     ${gina_tag}"
            echo "  Gina HCI: ${gina_hci_tag}"
            exit 1
          fi

          release_tag="${gina_tag}"

          build_date="${release_tag#${DEFAULT_TAG}-}"
          build_date="${build_date%-${short_sha}}"
          release_date="${build_date:0:4}-${build_date:4:2}-${build_date:6:2}"

          gina_current="${registry}/home-server-gina:${DEFAULT_TAG}"
          gina_hci_current="${registry}/home-server-gina-hci:${DEFAULT_TAG}"

          gina_release="${registry}/home-server-gina:${release_tag}"
          gina_hci_release="${registry}/home-server-gina-hci:${release_tag}"

          gina_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${gina_release}")"
          gina_hci_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${gina_hci_release}")"

          if [[ ! "${gina_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Gina digest: ${gina_digest}"
            exit 1
          fi

          if [[ ! "${gina_hci_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Gina HCI digest: ${gina_hci_digest}"
            exit 1
          fi

          release_title="Home Server Gina LTS - ${release_date}"

          cat > /tmp/release-notes.md <<EOF_NOTES
          ## Home Server Gina LTS

          Signed Home Server Gina images built directly from the current Universal Blue uCore LTS images.

          ### Home Server Gina

          Current LTS image:

          \`\`\`text
          ${gina_current}
          \`\`\`

          Release-specific image:

          \`\`\`text
          ${gina_release}
          \`\`\`

          Published digest:

          \`\`\`text
          ${gina_digest}
          \`\`\`

          ### Home Server Gina HCI

          Current LTS image:

          \`\`\`text
          ${gina_hci_current}
          \`\`\`

          Release-specific image:

          \`\`\`text
          ${gina_hci_release}
          \`\`\`

          Published digest:

          \`\`\`text
          ${gina_hci_digest}
          \`\`\`

          ### Switching to the images

          Home Server Gina:

          \`\`\`bash
          sudo bootc switch ${gina_current}
          \`\`\`

          Home Server Gina HCI:

          \`\`\`bash
          sudo bootc switch ${gina_hci_current}
          \`\`\`

          Both container images are signed with the Home Server Project Cosign signing key.
          EOF_NOTES

          if gh release view "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Updating existing release ${release_tag}"
            gh release edit "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${release_title}" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            echo "Creating release ${release_tag}"
            gh release create "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
